url: "https://speaking.gamov.io"
baseurl: ""
hero_background: "https://images.unsplash.com/photo-1540575467063-178a50c2df87?w=1920"

# Jekyll configuration
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
encoding: utf-8
timezone: UTC
future: true

# Embedded resources
# Canonical YouTube, Vimeo, Google, and Notist URLs work automatically.
# To embed a Notist custom domain, add only its hostname (no scheme or path).
resource_embeds:
  notist_custom_domains: []

# Kramdown configuration
kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Collections
collections:
  talks:
    output: true
    permalink: /talks/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "talks"
    values:
      layout: "talk"

# Build settings
# sass:
#   style: compressed

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Speaker configuration (single source of truth)
speaker:
  name: "Viktor Gamov"
  display_name: ""                 # Optional: Override for display (if empty, uses name)
  bio: "Principal Developer Advocate at Confluent, founded by the original creators of Apache Kafka®. Java Champion and speaker at JavaOne, Devoxx, Kafka Summit, and QCon. Expertise spans distributed systems, real-time data streaming, JVM, and DevOps. Co-author of “Enterprise Web Development” and “Apache Kafka® in Action”."
  # Portfolio hero (all optional)
  headline: "Principal Developer Advocate at Confluent"
  # Hero intro, same voice as the gamov.io homepage (falls back to bio)
  intro: "I build, break, and explain distributed systems. Developer advocate, author of Kafka in Action, and co-host of DevRel Radio. I’ve spent two decades turning complex tech into something humans actually enjoy using."
  badges: ["Java Champion", "Conference Speaker", "Published Author", "Podcast Host"]
  short_bio: "Viktor Gamov is a Principal Developer Advocate at Confluent, founded by the original creators of Apache Kafka®. Viktor is known for his insightful presentations at top industry events like JavaOne, Devoxx, Kafka Summit, and QCon. His expertise spans distributed systems, real-time data streaming, JVM, and DevOps."
  youtube_url: "https://www.youtube.com/@viktorgamov"
  speaking_since: ""               # e.g. "2011" — adds an "On stage since" stat
  booking_url: ""                  # e.g. "mailto:you@example.com" — shows an "Invite me to speak" button
  # Topics power the filter chips on the homepage; keywords match talk titles, events, and abstracts
  topics:
    - name: "AI & MCP"
      keywords: ["mcp", " ai", "ai ", "llm", "langchain4j", "koog", "spring ai", "agent"]
    - name: "Apache Kafka"
      keywords: ["kafka", "ksql", "schema registry", "event stream"]
    - name: "Apache Flink"
      keywords: ["flink"]
    - name: "Kubernetes & Cloud"
      keywords: ["kubernetes", "k8s", "kong", "ingress", "service mesh", "kuma", "cloud", "serverless", "knative"]
    - name: "Java & Spring"
      keywords: ["java", "spring", "quarkus", "kotlin", "jvm", "micronaut"]
  avatar_url: ""                   # Optional: Custom avatar URL (fallback if no social media avatars available)
  # Social media handles (all optional - leave empty to hide)
  social:
    linkedin: "vikgamov"         # Optional: LinkedIn username (generates https://linkedin.com/in/<username>)
    x: "gamussa"                 # Optional: X.com username
    github: "gamussa"            # Optional: GitHub username (also used for avatar)
    mastodon: ""                 # Optional: Full Mastodon URL (e.g., "https://mastodon.social/@username")
    bluesky: "gamussa.dev"       # Optional: BlueSky username

# Site metadata (templates will use speaker config)
title: "Viktor Gamov — Talks"
description: "Conference talk show notes and resources"

# Featured talks configuration
featured_talks_count: 3

# Featured conferences for "Featured at" logo strip (optional)
# If configured, shows these specific conferences in order
# If empty or not set, defaults to most recent unique conferences
# Example:
# featured_conferences:
#   - "Devoxx"
#   - "QCon"
#   - "DevNexus"
#   - "KubeCon"
featured_conferences:
  - "Devoxx"
  - "Kafka Summit"
  - "SpringOne"
  - "DevNexus"
  - "Current"
  - "NDC"
  - "Oracle Code One"
  - "KubeCon"
  - "Jfokus"
  - "IntelliJ IDEA Conf"

# UI Theme customization (all optional) - FR-011, US3
# See specs/001-ui-ux-redesign/data-model.md for details
# Note: Using 'ui_theme' to avoid conflict with Jekyll's built-in 'theme' setting
ui_theme:
  # Primary brand color (hex) - overrides --color-primary
  primary_color: "#6366f1"  # default = no override; gamov.css sets the brand palette
  # Default theme: "light", "dark", or "system"
  default_theme: "system"
  # Show theme toggle button in header
  show_theme_toggle: true

# Header brand and navigation, shared with gamov.io so both sites look like one
brand:
  name: "Viktor Gamov"
  url: "https://gamov.io/"
# icon: Lucide icon SVG markup (24x24 viewBox), same set gamov.io uses
