# SEO settings (will use speaker info dynamically)
# No need for redundant author or twitter config since speaker section provides this

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - test/
  - .bundle/
  - node_modules/
  - .git/
  - README.md
  - docs/

# Security - Note: safe mode strips iframes, so disabled for embed functionality
# safe: true
